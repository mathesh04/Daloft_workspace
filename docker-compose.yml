

services:


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm-backend
    restart: unless-stopped

    env_file:
      - .env
      - .env.docker
    networks:
      - hrm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:

        VITE_API_BASE_URL: /api
        VITE_APP_NAME: Daloft People
    container_name: hrm-frontend
    restart: unless-stopped
    ports:
      - "80:80"      
    depends_on:
      - backend
    networks:
      - hrm-net

networks:
  hrm-net:
    driver: bridge
