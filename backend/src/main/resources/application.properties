spring.application.name=employee-management-system



springdotenv.directory=${SPRING_DOTENV_DIR:../}


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000


jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}


server.port=${PORT}


attendance.geofence.enabled=${GEOFENCE_ENABLED}
attendance.geofence.latitude=${OFFICE_LATITUDE}
attendance.geofence.longitude=${OFFICE_LONGITUDE}
attendance.geofence.radius-meters=${OFFICE_GEOFENCE_RADIUS_METERS}
attendance.geofence.max-accuracy-meters=${MAX_GPS_ACCURACY_METERS}

attendance.office.start-time=${ATTENDANCE_OFFICE_START_TIME}
attendance.office.grace-minutes=${ATTENDANCE_GRACE_MINUTES}
attendance.required-minutes=${ATTENDANCE_REQUIRED_MINUTES}
attendance.half-day-minutes=${ATTENDANCE_HALF_DAY_MINUTES}


brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}


app.frontend-url=${APP_FRONTEND_URL}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL}


spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4


admin.employee-id=${ADMIN_EMPLOYEE_ID}
admin.password=${ADMIN_PASSWORD}
admin.name=${ADMIN_NAME}
admin.department=${ADMIN_DEPARTMENT}


cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:*}